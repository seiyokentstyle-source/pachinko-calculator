name: Deploy PACHIEV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calculations and session data
        run: node --test test.mjs spec-test.mjs session-test.mjs all-input-test.mjs before-seat-test.mjs
      - name: Check JavaScript syntax
        run: |
          for file in dist/*.mjs; do node --check "$file"; done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
